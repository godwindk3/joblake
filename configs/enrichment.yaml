# Normal enrichment cutoff. Explicit enrich-backfill uses its own date filters.
eligible_from: '2026-09-26T00:00:00+07:00'
max_jobs_per_run: 100
max_run_seconds: 7200 # Both Airflow enrichment tasks use this budget + 5 minutes as their timeout.
max_attempts: 3
max_output_tokens: 2048
request_timeout_seconds: 60
calibrate_input_tokens: true # Learns from >=20 measured requests; reserves full output cap.
providers:
  - name: gemini
    enforce_daily_budget: false # Let API 429 determine daily exhaustion; retain minute pacing.
    model: gemini-3.1-flash-lite
    key_env: GEMINI_API_KEY
    batch_size: 1 # Set to 3 after the paired benchmark passes.
    batch_max_input_tokens: 12000
    requests_per_minute: 12
    tokens_per_minute: 200000
    requests_per_day: 400
    tokens_per_day: 2000000
  - name: groq
    enforce_daily_budget: false # Shared by regular enrichment and backfill.
    model: openai/gpt-oss-120b
    key_env: GROQ_API_KEY
    requests_per_minute: 24
    tokens_per_minute: 7000
    requests_per_day: 800
    tokens_per_day: 160000
  - name: openrouter
    enabled: false # Temporarily disabled: poor evidence validation on real jobs
    model: nvidia/nemotron-3-super-120b-a12b:free
    output_format: json_schema
    reasoning_enabled: false
    max_output_tokens: 4096
    key_env: OPENROUTER_API_KEY
    requests_per_minute: 10
    tokens_per_minute: 16000
    requests_per_day: 40
    tokens_per_day: 200000
