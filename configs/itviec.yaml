source: itviec
source_adapter: joblake.sources.itviec.ITviecSource
enabled: true

discovery:
  transport: cloakbrowser
  headless: false
  timeout_seconds: 60
  continue_on_target_error: true

  humanize: true
  geoip: true
  storage_state_path: data/state/itviec_browser_state.json
  ready_selector: "h3[data-search--job-selection-target='jobTitle'][data-url]"
  ready_state: attached
  ready_timeout_seconds: 30

  settle_seconds:
    min: 1.5
    max: 4

  retry:
    max_attempts: 3
    base_delay_seconds: 10
    max_delay_seconds: 60

  pagination:
    page_param: page
    start_page: 1

    # Bỏ total_pages để tự đọc riêng trang cuối của mỗi location.
    max_auto_pages: 200

  delay:
    min_seconds: 5
    max_seconds: 10

  proxy:
    enabled: false
    server_env: ITVIEC_DISCOVERY_PROXY
    username_env: ITVIEC_PROXY_USERNAME
    password_env: ITVIEC_PROXY_PASSWORD

  targets:
    - name: ha_noi
      enabled: true
      base_url: https://itviec.com/it-jobs/ha-noi
      params:
        click_source: Navigation menu

    - name: ho_chi_minh
      enabled: true
      base_url: https://itviec.com/it-jobs/ho-chi-minh-hcm
      params:
        click_source: Navigation menu

    - name: da_nang
      enabled: true
      base_url: https://itviec.com/it-jobs/da-nang
      params:
        click_source: Navigation menu

    - name: others
      enabled: true
      base_url: https://itviec.com/it-jobs/others
      params:
        click_source: Navigation menu

detail:
  transport: cloakbrowser
  headless: false
  timeout_seconds: 60

  humanize: true
  geoip: true
  storage_state_path: data/state/itviec_browser_state.json
  ready_selector: h1
  ready_state: attached
  ready_timeout_seconds: 30

  settle_seconds:
    min: 1.5
    max: 4

  retry:
    max_attempts: 3
    base_delay_seconds: 10
    max_delay_seconds: 60

  validation:
    min_html_bytes: 5000
    min_text_chars: 100
    required_selectors:
      - h1
    allowed_hosts:
      - itviec.com
      - www.itviec.com
    required_path_prefixes:
      - /it-jobs/

  # Đặt null nếu muốn crawl toàn bộ URL pending.
  max_jobs_per_run: null

  delay:
    min_seconds: 5
    max_seconds: 10

  proxy:
    enabled: false
    server_env: ITVIEC_DETAIL_PROXY
    username_env: ITVIEC_PROXY_USERNAME
    password_env: ITVIEC_PROXY_PASSWORD

storage:
  provider: minio
  endpoint: localhost:9000
  endpoint_env: MINIO_ENDPOINT
  access_key_env: MINIO_ACCESS_KEY
  secret_key_env: MINIO_SECRET_KEY
  bucket_name: joblake
  secure: false
  ensure_bucket: true
  prefix: raw
  store_discovery: false

state:
  provider: sqlite
  database_path: data/state/joblake.db
  detail_max_attempts: 3
  detail_retry_delay_seconds: 3600
  integrity_check_on_start: true
  integrity_check_limit: 100

parse:
  parser_adapter: joblake.parsing.parsers.itviec.ITviecParser
  max_jobs_per_run: null
  max_attempts: 3
  stale_after_seconds: 3600

postgres:
  host_env: POSTGRES_HOST
  port_env: POSTGRES_PORT
  database_env: POSTGRES_DB
  user_env: POSTGRES_USER
  password_env: POSTGRES_PASSWORD
  connect_timeout_seconds: 10
  application_name: joblake-parser
