# Scope: software IT category c1 only; path pagination -trang-N-vi.html.
source: careerviet
source_adapter: joblake.sources.careerviet.CareerVietSource
enabled: true
cdc:
  enabled: true
  scope_version: 1
discovery:
  transport: requests
  user_agent: JobLake/0.1
  timeout_seconds: 30
  continue_on_target_error: true
  retry:
    max_attempts: 3
    base_delay_seconds: 5
    max_delay_seconds: 30
  pagination:
    page_param: page
    start_page: 1
    strategy: detect_last_page
    max_auto_pages: 200
  delay:
    min_seconds: 4
    max_seconds: 8
  targets:
  - name: software_it
    enabled: true
    base_url: https://careerviet.vn/viec-lam/cntt-phan-mem-c1-vi.html
detail:
  transport: requests
  user_agent: JobLake/0.1
  timeout_seconds: 30
  retry:
    max_attempts: 3
    base_delay_seconds: 10
    max_delay_seconds: 60
  validation:
    min_html_bytes: 5000
    min_text_chars: 100
    # Template-specific title/content checks live in CareerVietSource.
    required_selectors: []
    allowed_hosts:
    - careerviet.vn
    - www.careerviet.vn
    required_path_prefixes:
    - /vi/tim-viec-lam/
  max_jobs_per_run: null
  delay:
    min_seconds: 5
    max_seconds: 10
storage:
  provider: minio
  endpoint: localhost:9000
  endpoint_env: MINIO_ENDPOINT
  access_key_env: MINIO_ACCESS_KEY
  secret_key_env: MINIO_SECRET_KEY
  bucket_name: joblake
  secure: false
  ensure_bucket: true
  prefix: raw
  store_discovery: false
state:
  provider: postgres
  database_path: data/state/joblake.db
  detail_max_attempts: 3
  detail_retry_delay_seconds: 3600
  integrity_check_on_start: true
  integrity_check_limit: 100
parse:
  parser_adapter: joblake.parsing.parsers.careerviet.CareerVietParser
  max_jobs_per_run: null
  max_attempts: 3
  stale_after_seconds: 3600
postgres:
  host_env: POSTGRES_HOST
  port_env: POSTGRES_PORT
  database_env: POSTGRES_DB
  user_env: POSTGRES_USER
  password_env: POSTGRES_PASSWORD
  connect_timeout_seconds: 10
  application_name: joblake-parser
