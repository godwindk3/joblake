# Category 19 only. Page 1 uses base URL; later pages use ?page=N.
source: careerlink
source_adapter: joblake.sources.careerlink.CareerLinkSource
enabled: true
cdc:
  enabled: true
  scope_version: 1
discovery:
  transport: cloakbrowser
  headless: false
  timeout_seconds: 60
  humanize: true
  geoip: false
  challenge_wait_seconds: 60
  locale: vi-VN
  timezone_id: Asia/Ho_Chi_Minh
  storage_state_path: data/state/careerlink_browser_state.json
  ready_selector: 'li.job-item a.job-link[href]'
  ready_state: attached
  ready_timeout_seconds: 30
  settle_seconds:
    min: 1.5
    max: 4
  continue_on_target_error: true
  retry:
    max_attempts: 3
    base_delay_seconds: 90
    max_delay_seconds: 180
  pagination:
    page_param: page
    start_page: 1
    strategy: detect_last_page
    max_auto_pages: 200
  delay:
    min_seconds: 10
    max_seconds: 16
  proxy:
    enabled: false
    server_env: CAREERLINK_DISCOVERY_PROXY
    username_env: CAREERLINK_PROXY_USERNAME
    password_env: CAREERLINK_PROXY_PASSWORD
  targets:
  - name: software_it
    enabled: true
    base_url: https://www.careerlink.vn/viec-lam/cntt-phan-mem/19
detail:
  diagnostics_dir: data/state/diagnostics/careerlink/detail
  diagnostics_retention_days: 7
  diagnostics_max_captures: 30
  transport: cloakbrowser
  headless: false
  timeout_seconds: 60
  humanize: true
  geoip: false
  challenge_wait_seconds: 60
  locale: vi-VN
  timezone_id: Asia/Ho_Chi_Minh
  storage_state_path: data/state/careerlink_browser_state.json
  ready_selector: '#job-title'
  ready_state: attached
  ready_timeout_seconds: 30
  settle_seconds:
    min: 1.5
    max: 4
  retry:
    max_attempts: 2
    base_delay_seconds: 90
    max_delay_seconds: 180
  validation:
    min_html_bytes: 5000
    min_text_chars: 100
    required_selectors: []
    allowed_hosts:
    - careerlink.vn
    - www.careerlink.vn
    required_path_prefixes:
    - /tim-viec-lam/
  max_jobs_per_run: 30
  # Release the worker instead of exhausting the queue during a site-wide failure.
  max_consecutive_errors: 3
  delay:
    min_seconds: 7
    max_seconds: 15
  proxy:
    enabled: false
    server_env: CAREERLINK_DETAIL_PROXY
    username_env: CAREERLINK_PROXY_USERNAME
    password_env: CAREERLINK_PROXY_PASSWORD
storage:
  provider: minio
  endpoint: localhost:9000
  endpoint_env: MINIO_ENDPOINT
  access_key_env: MINIO_ACCESS_KEY
  secret_key_env: MINIO_SECRET_KEY
  bucket_name: joblake
  secure: false
  ensure_bucket: true
  prefix: raw
  store_discovery: false
state:
  source_lock_wait_seconds: 60
  provider: postgres
  database_path: data/state/joblake.db
  detail_max_attempts: 3
  detail_retry_delay_seconds: 3600
  integrity_check_on_start: true
  integrity_check_limit: 100
parse:
  parser_adapter: joblake.parsing.parsers.careerlink.CareerLinkParser
  max_jobs_per_run: null
  max_attempts: 3
  stale_after_seconds: 3600
postgres:
  host_env: POSTGRES_HOST
  port_env: POSTGRES_PORT
  database_env: POSTGRES_DB
  user_env: POSTGRES_USER
  password_env: POSTGRES_PASSWORD
  connect_timeout_seconds: 10
  application_name: joblake-parser
