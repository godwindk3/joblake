[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "joblake"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "playwright",
    "PyYAML",
    "requests",
    "cloakbrowser ",
]

[tool.setuptools.packages.find]
where = ["src"]