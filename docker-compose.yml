x-log-rotation: &log-rotation
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  minio:
    logging: *log-rotation
    image: joblake-minio:RELEASE.2025-10-15T17-29-55Z
    build: ./orchestration/minio
    pull_policy: build
    container_name: joblake-minio

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    volumes:
      - minio_data:/data

    # Start again when Docker Desktop's engine starts, even after a manual stop.
    restart: always

  postgres:
    logging: *log-rotation
    image: postgres:16-alpine
    container_name: joblake-postgres

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-joblake}
      POSTGRES_USER: ${POSTGRES_USER:-joblake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: always

volumes:
  minio_data:
  postgres_data:
