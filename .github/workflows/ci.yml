name: JobLake CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      JOBLAKE_TEST_POSTGRES: '0'
      JOBLAKE_TEST_SERVING: '0'
      JOBLAKE_TEST_ENRICHMENT: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests
      - run: python -m joblake.main --help

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: joblake_ci
          POSTGRES_USER: joblake_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U joblake_ci -d joblake_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: joblake_ci
      POSTGRES_USER: joblake_ci
      POSTGRES_PASSWORD: ci-only-password
      LOCAL_DATABASE_URL: postgresql://joblake_ci:ci-only-password@localhost:5432/joblake_ci
      JOBLAKE_TEST_POSTGRES: '1'
      JOBLAKE_TEST_SERVING: '1'
      JOBLAKE_TEST_ENRICHMENT: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Migrate the disposable CI database
        run: python -m alembic upgrade head
      - name: Run all tests, including CDC, serving search and enrichment SQL
        run: python scripts/run_ci_tests.py
      - name: Exercise health queries against the migrated schema
        run: python -m joblake.data_health --output-dir tmp/ci-health

  airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build the production Airflow image
        run: docker build -f orchestration/airflow/Dockerfile -t joblake-airflow:ci .
      - name: Import and validate every DAG in the real runtime
        run: >-
          docker run --rm --entrypoint python
          -e AIRFLOW__CORE__LOAD_EXAMPLES=False
          -v "$GITHUB_WORKSPACE/orchestration/airflow/dags:/opt/airflow/dags:ro"
          -v "$GITHUB_WORKSPACE/orchestration/airflow/check_dag.py:/opt/airflow/check_dag.py:ro"
          joblake-airflow:ci /opt/airflow/check_dag.py
